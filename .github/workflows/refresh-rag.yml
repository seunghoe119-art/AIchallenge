name: Refresh PDF corpus
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh-pdf-corpus
  cancel-in-progress: false
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: rag/requirements.txt
      - run: python -m pip install -r rag/requirements.txt
      - name: Test classification and validation
        run: python -m unittest discover -s rag -p 'test_*.py'
      - name: Regenerate and validate PDF corpus
        run: python rag/prepare_rag.py --repo . --output rag
      - name: Save generated data
        shell: bash
        run: |
          set -euo pipefail
          git add rag/manifest.json rag/pages.jsonl rag/verification.json
          if git diff --cached --quiet; then
            echo 'No source changes; generated data is current.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh PDF page corpus'
          git push origin HEAD:main
