<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>기능 테스트 · 스마트 전술 AI</title><link rel="stylesheet" href="../technology/technology.css?v=privacy-alert-1"><link rel="stylesheet" href="../site-navigation.css?v=3"><script src="../silent-videos.js?v=1"></script>
<style>
.emergency-fields{padding:80px 28px 96px;background:#f7fafc;min-height:calc(100svh - var(--site-header-height,88px))}
.emergency-inner{max-width:1120px;margin:auto}
.emergency-heading{text-align:center;margin-bottom:42px}
.emergency-heading>span{color:#168b9e;font-size:11px;font-weight:750;letter-spacing:.22em}
.emergency-heading h2{font-size:clamp(30px,4vw,44px);letter-spacing:-.05em;margin:16px 0}
.emergency-heading p{color:#647d8a;font-size:16px;line-height:1.8}
.emergency-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
button.emergency-card{--accent:#df404b;--tint:#fff0f2;appearance:none;display:flex;flex-direction:column;align-items:flex-start;text-align:left;width:100%;min-width:0;min-height:240px;margin:0;padding:30px;border:1px solid #dce6ec;border-radius:22px;background:#fff;color:#132d39;font-family:inherit;cursor:pointer;box-shadow:0 5px 18px #183e4c05;transition:transform .24s ease,box-shadow .24s ease,border-color .24s ease,background .24s ease}
button.emergency-card.rescue{--accent:#e97523;--tint:#fff5ec}
button.emergency-card.medical{--accent:#3478e5;--tint:#edf4ff}
button.emergency-card.hazmat{--accent:#c48a10;--tint:#fff9e7}
button.emergency-card.facilities{--accent:#168b9e;--tint:#e9f7f8}
button.emergency-card.public-use{--accent:#8260c5;--tint:#f3eefa}
.emergency-card .emergency-icon{display:grid;place-items:center;width:62px;height:62px;margin:0 0 22px;border-radius:18px;background:var(--tint);color:var(--accent);transition:transform .24s ease,box-shadow .24s ease}
.emergency-card .emergency-icon svg{width:31px;height:31px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.emergency-card h3{font-size:22px;line-height:1.4;margin:0 0 10px;color:#132d39}
.emergency-card p{font-size:14px;line-height:1.9;margin:0;color:#6b8190;word-break:keep-all}
@media(hover:hover){button.emergency-card:hover{transform:translateY(-6px);border-color:var(--accent);box-shadow:0 16px 34px #183e4c12;background:linear-gradient(145deg,#fff,var(--tint))}button.emergency-card:hover .emergency-icon{transform:translateY(-2px) rotate(-5deg);box-shadow:0 5px 16px #183e4c0c}}
button.emergency-card:active{transform:translateY(-1px) scale(.98);box-shadow:0 4px 12px #183e4c12}
button.emergency-card:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
@media(max-width:800px){.emergency-fields{padding:55px 22px 70px}.emergency-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}button.emergency-card{padding:24px;min-height:225px}}
@media(max-width:430px){.emergency-grid{grid-template-columns:1fr}button.emergency-card{min-height:0;padding:24px}.emergency-heading p{font-size:14px}}
@media(prefers-reduced-motion:reduce){button.emergency-card,.emergency-card .emergency-icon{transition:none!important;transform:none!important}}
</style>

<button type="button" class="emergency-card public-use"><div class="emergency-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21V8l9-5 9 5v13M2 21h20M9 21v-6h6v6M7 9h1m8 0h1M7 12h1m8 0h1"/><circle cx="12" cy="9" r="1.5"/></svg></div><h3>다중이용업</h3><p>다중이용업소의 안전관리<br>예방 기준과 현장 점검</p></button>
